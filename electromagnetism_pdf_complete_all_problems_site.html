    function renderCards() {
        const container = document.getElementById('cardsList');
        let html = '';

        cardsData.forEach(card => {
            html += `
            <div class="card-item" data-set="${card.set_num}" data-search="${(card.title + ' ' + card.problem + ' ' + card.solution).replace(/"/g, '&quot;')}">
                <div class="card-top">
                    <span class="card-badge">${card.title}</span>
                    <span class="card-meta">第${card.set_num}回 | PDF ${card.pdf_pages} | Card #${card.card_num}</span>
                </div>
                <div class="card-problem">${card.problem}</div>
                <button class="sol-toggle" onclick="toggleSol(this)">
                    <span>💡 模範解答・導出プロセスを開く</span>
                    <span>▼</span>
                </button>
                <div class="sol-content">
                    <div class="sol-heading">【模範解答・解法プロセス】</div>
                    ${card.solution}
                </div>
            </div>
            `;
        });

        container.innerHTML = html;
    }

    function toggleSol(btn) {
        const content = btn.nextElementSibling;
        const arrow = btn.querySelector('span:last-child');
        content.classList.toggle('active');
        if (content.classList.contains('active')) {
            arrow.textContent = '▲';
            if (window.MathJax) { MathJax.typesetPromise([content]); }
        } else {
            arrow.textContent = '▼';
        }
    }

    function filterSet(setNum, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.querySelectorAll('.card-item').forEach(card => {
            if (setNum === 'all' || card.getAttribute('data-set') == setNum) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    function filterCards() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.card-item').forEach(card => {
            const text = card.getAttribute('data-search').toLowerCase();
            if (text.includes(query)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    // Initialize
    renderCards();
    </script>
