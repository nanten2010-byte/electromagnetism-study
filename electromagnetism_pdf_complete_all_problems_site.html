    function renderCards() {
        const container = document.getElementById('cardsList');
        let html = '';

        setsData.forEach(set => {
            set.questions.forEach(q => {
                html += `
                <div class="card-item" data-set="${set.set_num}" data-search="${(q.problem + ' ' + q.ans + ' ' + q.solution).replace(/"/g, '&quot;')}">
                    <div class="card-top">
                        <span class="card-badge">【第${set.set_num}回】問 ${q.q_num}</span>
                        <span class="card-meta">第${set.set_num}回 | PDF ${set.pdf_pages} | 問 ${q.id}</span>
                    </div>
                    <div class="card-problem">${q.problem}</div>
                    
                    <div class="ans-box">
                        <div class="ans-title">✅ 【明確な最終答え】</div>
                        <div class="ans-value">${q.ans}</div>
                    </div>

                    <button class="sol-toggle" onclick="toggleSol(this)">
                        <span>📖 詳細な途中式・計算ステップを開く / 閉じる</span>
                        <span>▼</span>
                    </button>
                    <div class="sol-content">
                        <div style="font-weight:900; color:#2563eb; font-size:19px; margin-bottom:14px;">【詳細な途中式・解法ステップ】</div>
                        ${q.solution}
                    </div>
                </div>
                `;
            });
        });

        container.innerHTML = html;
        if (window.MathJax) { MathJax.typesetPromise(); }
    }

    function toggleSol(btn) {
        const content = btn.nextElementSibling;
        const arrow = btn.querySelector('span:last-child');
        content.classList.toggle('active');
        if (content.classList.contains('active')) {
            arrow.textContent = '▲';
            if (window.MathJax) { MathJax.typesetPromise([content]); }
        } else {
            arrow.textContent = '▼';
        }
    }

    function filterSet(setNum, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.querySelectorAll('.card-item').forEach(card => {
            if (setNum === 'all' || card.getAttribute('data-set') == setNum) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    function filterCards() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.card-item').forEach(card => {
            const text = card.getAttribute('data-search').toLowerCase();
            if (text.includes(query)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    renderCards();
    </script>
