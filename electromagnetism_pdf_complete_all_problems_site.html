 g_x}{\\partial x} + \\frac{\\partial g_y}{\\partial y} + \\frac{\\partial g_z}{\\partial z}$<br><b>(1)</b> $0 + 0 + 2x^2 z = 2x^2 z$<br><b>(2)</b> $2x + 2y + 2z = 2(x+y+z)$<br><b>(3)</b> $-y e^{-xy} + 0 - x e^{-zx} = -y e^{-xy} - x e^{-zx}$"}, {"id": "Q1-03", "q_num": "3", "problem": "次式で表されるベクトル $\\mathbf{v}$ について $\\nabla \\times \\mathbf{v} = \\text{rot } \\mathbf{v}$ を求めよ．<br><b>(1)</b> $\\mathbf{v} = z \\mathbf{i} + x \\mathbf{j} + y \\mathbf{k}$<br><b>(2)</b> $\\mathbf{v} = x \\mathbf{i} + yz \\mathbf{j} - (x^2 + z^2) \\mathbf{k}$<br><b>(3)</b> $\\mathbf{v} = (x \\mathbf{i} + y \\mathbf{j} + z \\mathbf{k})(x^2 + y^2 + z^2)^{-3/2}$", "ans": "(1) $\\mathbf{i} + \\mathbf{j} + \\mathbf{k}$<br>(2) $-y \\mathbf{i} + 2x \\mathbf{j}$<br>(3) $\\mathbf{0}$", "solution": "<b>(1)</b> $(1-0)\\mathbf{i} + (1-0)\\mathbf{j} + (1-0)\\mathbf{k} = \\mathbf{i} + \\mathbf{j} + \\mathbf{k}$<br><b>(2)</b> $(-y-y)\\mathbf{i} - (-2x-0)\\mathbf{j} + 0\\mathbf{k} = -2y \\mathbf{i} + 2x \\mathbf{j}$<br><b>(3)</b> 中心力場のため $\\nabla \\times \\mathbf{v} = \\mathbf{0}$"}, {"id": "Q1-04", "q_num": "4", "problem": "$\\mathbf{r} = x\\mathbf{i} + y\\mathbf{j} + z\\mathbf{k}, r = |\\mathbf{r}|$ とするとき，次を求めよ．<br><b>(1)</b> $\\nabla r$<br><b>(2)</b> $\\nabla \\left(\\frac{1}{r}\\right)$<br><b>(3)</b> $\\nabla r^n$<br><b>(4)</b> $\\nabla \\ln r$", "ans": "(1) $\\frac{\\mathbf{r}}{r}$<br>(2) $-\\frac{\\mathbf{r}}{r^3}$<br>(3) $n r^{n-2} \\mathbf{r}$<br>(4) $\\frac{\\mathbf{r}}{r^2}$", "solution": "<b>(1)</b> $\\nabla r = \\frac{\\mathbf{r}}{r}$<br><b>(2)</b> $\\nabla (1/r) = -\\frac{\\mathbf{r}}{r^3}$<br><b>(3)</b> $\\nabla r^n = n r^{n-2} \\mathbf{r}$<br><b>(4)</b> $\\nabla \\ln r = \\frac{\\mathbf{r}}{r^2}$"}, {"id": "Q1-05", "q_num": "5", "problem": "位置ベクトル $\\mathbf{r}$, $r = |\\mathbf{r}|$ のとき以下を求めよ．<br><b>(1)</b> $\\nabla \\cdot (\\mathbf{r}/r)$<br><b>(2)</b> $\\nabla \\cdot (\\mathbf{r}/r^3)$", "ans": "(1) $\\frac{2}{r}$<br>(2) $0$ ($r \\neq 0$)", "solution": "<b>(1)</b> $(-\\frac{\\mathbf{r}}{r^3})\\cdot\\mathbf{r} + \\frac{3}{r} = \\frac{2}{r}$<br><b>(2)</b> $(-3r^{-5}\\mathbf{r})\\cdot\\mathbf{r} + 3r^{-3} = 0$"}, {"id": "Q1-06", "q_num": "6", "problem": "$\\varphi = xyz, \\mathbf{A} = x^2 yz \\mathbf{i} + xy^2 z \\mathbf{j} - xyz^2 \\mathbf{k}$ について次を求めよ．<br><b>(1)</b> $\\nabla \\varphi$<br><b>(2)</b> $\\nabla \\cdot \\mathbf{A}$<br><b>(3)</b> $\\Delta \\varphi$<br><b>(4)</b> $\\nabla \\cdot (\\varphi \\mathbf{A})$<br><b>(5)</b> $\\mathbf{A} \\cdot \\nabla \\varphi$", "ans": "(1) $yz \\mathbf{i} + xz \\mathbf{j} + xy \\mathbf{k}$<br>(2) $2xyz$<br>(3) $0$<br>(4) $4x^2 y^2 z^2$<br>(5) $x^2 y^2 z^2$", "solution": "<b>(1)</b> $yz \\mathbf{i} + xz \\mathbf{j} + xy \\mathbf{k}$<br><b>(2)</b> $2xyz$<br><b>(3)</b> $0$<br><b>(4)</b> $4x^2 y^2 z^2$<br><b>(5)</b> $x^2 y^2 z^2$"}, {"id": "Q1-07", "q_num": "7", "problem": "$\\mathbf{A} = x^2 z \\mathbf{i} + yz^2 \\mathbf{j} - 2xy \\mathbf{k}, \\mathbf{B} = 2y^2 \\mathbf{i} - 3yz \\mathbf{j} + zx \\mathbf{k}, \\varphi = x^2 + 2yz$ について計算せよ．", "ans": "(1) $(2yz^3 + 4xy^2)\\mathbf{i} - (4x^2y + 2x^3z)\\mathbf{j} + (2x^2z^2 - 2xyz^2)\\mathbf{k}$<br>(2) $(\\nabla \\times \\mathbf{A}) \\times \\mathbf{B}$<br>(3) $\\mathbf{B} \\cdot (\\nabla \\times \\mathbf{A})$", "solution": "$\\nabla \\varphi = (2x, 2z, 2y)$。外積・内積計算。"}, {"id": "Q1-08", "q_num": "8", "problem": "つるまき線 $C: \\mathbf{r}(t) = 3 \\cos t \\mathbf{i} + 3 \\sin t \\mathbf{j} + 4t \\mathbf{k}, (0 \\le t \\le 2\\pi)$<br><b>(1)</b> 単位接線ベクトル $\\mathbf{u}$<br><b>(2)</b> 曲線の長さ $s$", "ans": "(1) $\\mathbf{u} = \\frac{1}{5}(-3\\sin t \\mathbf{i} + 3\\cos t \\mathbf{j} + 4\\mathbf{k})$<br>(2) $s = 10\\pi$", "solution": "$\\left|\\frac{d\\mathbf{r}}{dt}\\right| = 5$。<br><b>(1)</b> $\\mathbf{u} = \\frac{1}{5}(-3\\sin t \\mathbf{i} + 3\\cos t \\mathbf{j} + 4\\mathbf{k})$<br><b>(2)</b> $s = 10\\pi$"}, {"id": "Q1-09", "q_num": "9", "problem": "曲面 $\\mathbf{r} = a \\sin u \\cos v \\mathbf{i} + a \\sin u \\sin v \\mathbf{j} + a \\cos u \\mathbf{k} \\left(0 \\le u \\le \\frac{ 2} [t\\sin t + \\cos t]_0^\\pi = -4\\sqrt{2}$"}, {"id": "Q2-07", "q_num": "7", "problem": "$\\mathbf{F} = 2x\\mathbf{i} + y\\mathbf{j} + 2z\\mathbf{k}$, 曲線 $C: \\mathbf{r}(t) = t\\mathbf{i} + t^2\\mathbf{j} + (1-t)\\mathbf{k} (0 \\le t \\le 1)$ のとき $\\int_C \\mathbf{F} \\cdot d\\mathbf{r}$ を求めよ．", "ans": "$\\frac{1}{2}$", "solution": "$d\\mathbf{r} = (1, 2t, -1) dt$。$\\int_0^1 (2t^3 + 4t - 2) dt = \\frac{1}{2}$"}]}, {"set_num": 3, "title": "第3回 演習とレポート（曲面・面積分・フラックス・定理）", "pdf_pages": "P.18 〜 P.30", "questions": [{"id": "Q3-01", "q_num": "1", "problem": "平面 $S: 2x + 2y + z = 4 (x \\ge 0, y \\ge 0, z \\ge 0)$ 上のスカラー場 $\\varphi(x, y, z) = 3x + 2y + z$ の面積分 $\\iint_S \\varphi dS$ を求めよ．", "ans": "$28$", "solution": "$z = 4 - 2x - 2y$, $dS = 3 dx dy$。$\\varphi = x + 4$。$3 \\int_0^2 dx \\int_0^{2-x} (x+4) dy = 28$"}, {"id": "Q3-02", "q_num": "2", "problem": "曲面 $S: z = 2 - x^2 - y^2 (x \\ge 0, y \\ge 0, z \\ge 0)$ で面積分 $\\iint_S (x^2 + y^2) dS$ を求めよ．", "ans": "$\\frac{\\pi(149\\sqrt{17} + 1)}{240}$", "solution": "$dS = \\sqrt{1 + 4r^2} r dr d\\theta$。極座標積分を実行。"}]}, {"set_num": 4, "title": "第4回 演習とレポート（ベクトル解析の三大定理：Gauss & Stokes）", "pdf_pages": "P.31 〜 P.44", "questions": [{"id": "Q4-01", "q_num": "1", "problem": "力 $\\mathbf{P} = 4xy\\mathbf{i} - 8x\\mathbf{j} + 2\\mathbf{k}$ による仕事 $W$ を求めよ．", "ans": "(1) $0$<br>(2) $-60$", "solution": "<b>(1)</b> $W = \\int_3^0 (8x^2 - 16x) dx = 0$<br><b>(2)</b> $W = \\int_0^3 (8x^2 - 32x + 4) dx = -60$"}]}, {"set_num": 5, "title": "第5回 演習とレポート（クーロンの法則と連続電荷分布の電場）", "pdf_pages": "P.45 〜 P.56", "questions": [{"id": "Q5-01", "q_num": "1", "problem": "地球の総電荷 $-4.6 \\times 10^5 \\text{ C}$ に相当する電子の数を求めよ．", "ans": "$2.87 \\times 10^{24} \\text{ 個}$", "solution": "$N = \\frac{4.6 \\times 10^5}{1.602 \\times 10^{-19}} \\approx 2.87 \\times 10^{24}$ 個"}]}, {"set_num": 6, "title": "第6回 演習とレポート（ガウスの法則と電場導出・単振動）", "pdf_pages": "P.57 〜 P.68", "questions": [{"id": "Q6-01", "q_num": "1", "problem": "点電荷 $+2q$ と $-q$ が $a$ 離れてある．電場が 0 となる位置を求めよ．", "ans": "$-q$ の外側 $x = (\\sqrt{2}+1)a$", "solution": "$\\frac{2q}{(a+x)^2} = \\frac{q}{x^2} \\implies x = (\\sqrt{2}+1)a$"}]}, {"set_num": 7, "title": "第7回 演習とレポート（静電ポテンシャル・電位・電気双極子）", "pdf_pages": "P.69 〜 P.86", "questions": [{"id": "Q7-01", "q_num": "1", "problem": "$1 \\text{ eV}$ は何 J か．", "ans": "$1.602 \\times 10^{-19} \\text{ J}$", "solution": "$1 \\text{ eV} = e \\times 1 \\text{ V} = 1.602 \\times 10^{-19} \\text{ J}$"}]}, {"set_num": 8, "title": "第8回 演習とレポート（導体・鏡像法・コンデンサー・静電エネルギー）", "pdf_pages": "P.87 〜 P.99", "questions": [{"id": "Q8-01", "q_num": "1", "problem": "導体表面（面密度 $\\sigma$）の直外の電場 $E$ を求めよ．", "ans": "$E = \\frac{\\sigma}{\\varepsilon_0}$", "solution": "導体内部 $E=0$ より導体表面ガウス面で $E = \\frac{\\sigma}{\\varepsilon_0}$"}]}, {"set_num": 9, "title": "第9回 演習とレポート（オームの法則・定常電流・抵抗）", "pdf_pages": "P.100 〜 P.108", "questions": [{"id": "Q9-01", "q_num": "1", "problem": "雷電荷 $1.2 \\text{ C}$ が $1.0 \\,\\mu\\text{s}$ で放電した．雷電流 $I$ はいくらか．", "ans": "$1.2 \\times 10^6 \\text{ A} \\quad (1.2 \\text{ MA})$", "solution": "$I = \\frac{\\Delta Q}{\\Delta t} = \\frac{1.2}{1.0 \\times 10^{-6}} = 1.2 \\times 10^6 \\text{ A}$"}]}, {"set_num": 10, "title": "第10回 演習とレポート（ポアソン方程式・ラプラス方程式・境界値問題）", "pdf_pages": "P.109 〜 P.119", "questions": [{"id": "Q10-01", "q_num": "1", "problem": "電荷密度 $\\rho_0$ の無限平板領域（$-d \\le x \\le d$）でポアソン方程式を解き $\\phi(x)$ と $E(x)$ を求めよ．", "ans": "$\\phi(x) = V_0 - \\frac{\\rho_0}{2\\varepsilon_0} x^2, \\quad E(x) = \\frac{\\rho_0}{\\varepsilon_0} x$", "solution": "$\\frac{d^2\\phi}{dx^2} = -\\frac{\\rho_0}{\\varepsilon_0}$ を2回積分。"}]}, {"set_num": 11, "title": "第11回 演習とレポート（コンデンサー・静電容量・誘電体）", "pdf_pages": "P.120 〜 P.129", "questions": [{"id": "Q11-01", "q_num": "1", "problem": "平行板コンデンサーの半分の領域に比誘電率 $\\varepsilon_r$ の誘電体を挿入したときの容量 $C$ を求めよ．", "ans": "$C = \\frac{\\varepsilon_0 S}{d} \\frac{2\\varepsilon_r}{\\varepsilon_r + 1}$", "solution": "直列合成: $C_1 = \\frac{2\\varepsilon_0 \\varepsilon_r S}{d}, C_2 = \\frac{2\\varepsilon_0 S}{d}$"}]}, {"set_num": 12, "title": "第12回 演習とレポート（誘電体・電界と電束密度の境界条件）", "pdf_pages": "P.130 〜 P.134", "questions": [{"id": "Q12-01", "q_num": "1", "problem": "誘電体（誘電率 $\\varepsilon$）入りコンデンサーに電圧 $V$ をかけたときの (1) $E, D, P$, (2) エネルギー $U$ を求めよ．", "ans": "(1) $E = \\frac{V}{d}, \\quad D = \\frac{\\varepsilon V}{d}, \\quad P = (\\varepsilon - \\varepsilon_0)\\frac{V}{d}$<br>(2) $U = \\frac{1}{2} \\frac{\\varepsilon S V^2}{d}$", "solution": "定義式より導出。"}]}];

    function renderCards() {
        const container = document.getElementById('cardsList');
        if (!container) return;
        let html = '';

        setsData.forEach(set => {
            set.questions.forEach(q => {
                html += `
                <div class="card-item" data-set="${set.set_num}" data-search="${(q.problem + ' ' + q.ans + ' ' + q.solution).replace(/"/g, '&quot;')}">
                    <div class="card-top">
                        <span class="card-badge">【第${set.set_num}回】問 ${q.q_num}</span>
                        <span class="card-meta">第${set.set_num}回 | PDF ${set.pdf_pages} | 問 ${q.id}</span>
                    </div>
                    <div class="card-problem">${q.problem}</div>
                    
                    <div class="ans-box">
                        <div class="ans-title">✅ 【明確な最終答え】</div>
                        <div class="ans-value">${q.ans}</div>
                    </div>

                    <button class="sol-toggle" onclick="toggleSol(this)">
                        <span>📖 詳細な途中式・計算ステップを開く / 閉じる</span>
                        <span>▼</span>
                    </button>
                    <div class="sol-content">
                        <div style="font-weight:900; color:#2563eb; font-size:19px; margin-bottom:14px;">【詳細な途中式・解法ステップ】</div>
                        ${q.solution}
                    </div>
                </div>
                `;
            });
        });

        container.innerHTML = html;
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([container]);
        }
    }

    window.toggleSol = function(btn) {
        const content = btn.nextElementSibling;
        const arrow = btn.querySelector('span:last-child');
        content.classList.toggle('active');
        if (content.classList.contains('active')) {
            arrow.textContent = '▲';
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([content]);
            }
        } else {
            arrow.textContent = '▼';
        }
    }

    window.filterSet = function(setNum, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.querySelectorAll('.card-item').forEach(card => {
            if (setNum === 'all' || card.getAttribute('data-set') == setNum) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    window.filterCards = function() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.card-item').forEach(card => {
            const text = card.getAttribute('data-search').toLowerCase();
            if (text.includes(query)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    document.addEventListener('DOMContentLoaded', renderCards);
    renderCards();
    </script>
