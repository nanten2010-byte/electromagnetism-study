    function renderSets() {
        const container = document.getElementById('setsContainer');
        let html = '';

        setsData.forEach(set => {
            html += `
            <div class="set-section" id="set-${set.set_num}" data-set="${set.set_num}">
                <div class="set-header">
                    <div class="set-title-group">
                        <span class="set-tag">第${set.set_num}回</span>
                        <h2 class="set-title">${set.title}</h2>
                    </div>
                    <div class="set-meta">PDF ${set.pdf_pages} 掲載 | 収録 ${set.questions.length} 問</div>
                </div>
                <div class="q-grid">
            `;

            set.questions.forEach(q => {
                html += `
                    <div class="q-card" data-search="${(q.problem + ' ' + q.solution).replace(/"/g, '&quot;')}">
                        <div class="q-header">
                            <span class="q-num">問 ${q.q_num}</span>
                        </div>
                        <div class="q-problem">${q.problem}</div>
                        <button class="sol-toggle" onclick="toggleSol(this)">
                            <span>💡 解答・解説・導出ステップを表示</span>
                            <span>▼</span>
                        </button>
                        <div class="sol-content">
                            <div class="sol-heading">【模範解答・導出プロセス】</div>
                            ${q.solution}
                        </div>
                    </div>
                `;
            });

            html += `
                </div>
            </div>
            `;
        });

        container.innerHTML = html;
    }

    function toggleSol(btn) {
        const content = btn.nextElementSibling;
        const arrow = btn.querySelector('span:last-child');
        content.classList.toggle('active');
        if (content.classList.contains('active')) {
            arrow.textContent = '▲';
            if (window.MathJax) { MathJax.typesetPromise([content]); }
        } else {
            arrow.textContent = '▼';
        }
    }

    function filterSet(setNum, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.querySelectorAll('.set-section').forEach(sec => {
            if (setNum === 'all' || sec.getAttribute('data-set') == setNum) {
                sec.style.display = 'block';
            } else {
                sec.style.display = 'none';
            }
        });
    }

    function filterCards() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.q-card').forEach(card => {
            const text = card.getAttribute('data-search').toLowerCase();
            if (text.includes(query)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    // Initialize
    renderSets();
    </script>
</body>
