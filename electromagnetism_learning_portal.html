2} = \\frac{p \\cos\\theta}{4\\pi\\varepsilon_0 r^2}$ （$p=ql$: 電気双極子モーメント）"}]}, {"id": "set8", "title": "第8回演習とレポート", "desc": "導体・鏡像法・コンデンサーと仮想仕事の原理 （全 8 問）", "count": 8, "problems": [{"num": "問 8-1", "text": "無限に広い平板状導体の表面に一様な面密度 $\\sigma$ で電荷が分布している。\n1) この平板状導体から距離 $x$ にある点 P における電場の強さを求めよ。\n2) 点 P における電位を求めよ。ただし，導体面上の電位を $V_0$ とする。", "formula": "$$E = \\frac{\\sigma}{\\varepsilon_0} \\implies \\sigma = \\varepsilon_0 E$$", "point": "導体表面直外の電場 $E$ と表面電荷面密度 $\\sigma$ の関係式（ガウスの法則の局所形）を適用します。", "check": "導体内部電場ゼロのため、表面電場はすべて外向き法線方向を向く。", "hint": "💡 解法のヒント: 導体内部は $E=0$, 導体外部直上は $E = \\frac{\\sigma}{\\varepsilon_0}$。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: 導体内部は $E=0$, 導体外部直上は $E = \\frac{\\sigma}{\\varepsilon_0}$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n1) $E = \\frac{\\sigma}{\\varepsilon_0}$\n2) $V(x) = V_0 - \\frac{\\sigma}{\\varepsilon_0} x$", "ans": "🔑 解答・結果:\n1) $E = \\frac{\\sigma}{\\varepsilon_0}$\n2) $V(x) = V_0 - \\frac{\\sigma}{\\varepsilon_0} x$"}, {"num": "問 8-2", "text": "半径 $2\\,\\mathrm{cm}, 4\\,\\mathrm{cm}$ の 2 つの金属を遠く離して針金で接続した。今 $+6.0\\times 10^{-4}\\,\\mathrm{C}$ の電荷を一方の金属球に与えた。それぞれの球の表面電荷と表面電場を求めよ。($\\varepsilon_0 = 8.9\\times 10^{-12}\\,\\mathrm{F/m}$)", "formula": "$$V_1 = V_2 \\implies \\frac{Q_1}{4\\pi\\varepsilon_0 R_1} = \\frac{Q_2}{4\\pi\\varepsilon_0 R_2} \\implies \\frac{Q_1}{Q_2} = \\frac{R_1}{R_2}$$", "point": "導線で接続された2導体球の電位が共通（等電位）になる条件から、電荷配分比および表面電荷密度比を求めます。", "check": "面密度比 $\\sigma_1/\\sigma_2 = R_2/R_1$ となり、半径の小さい（尖った）球ほど電荷が集中することを確認。", "hint": "💡 解法のヒント: 等電位より $\\frac{Q_1}{R_1} = \\frac{Q_2}{R_2} \\implies Q_2 = 2Q_1$。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: 等電位より $\\frac{Q_1}{R_1} = \\frac{Q_2}{R_2} \\implies Q_2 = 2Q_1$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n$Q_1 = 2.0\\times 10^{-4}\\,\\mathrm{C}, Q_2 = 4.0\\times 10^{-4}\\,\\mathrm{C}$\n面密度: $\\sigma_1 = 0.040\\,\\mathrm{C/m^2}, \\sigma_2 = 0.020\\,\\mathrm{C/m^2}$\n表面電場: $E_1 = 4.5\\times 10^9\\,\\mathrm{V/m}, E_2 = 2.2\\times 10^9\\,\\mathrm{V/m}$", "ans": "🔑 解答・結果:\n$Q_1 = 2.0\\times 10^{-4}\\,\\mathrm{C}, Q_2 = 4.0\\times 10^{-4}\\,\\mathrm{C}$\n面密度: $\\sigma_1 = 0.040\\,\\mathrm{C/m^2}, \\sigma_2 = 0.020\\,\\mathrm{C/m^2}$\n表面電場: $E_1 = 4.5\\times 10^9\\,\\mathrm{V/m}, E_2 = 2.2\\times 10^9\\,\\mathrm{V/m}$"}, {"num": "問 8-3", "text": "内半径 $a$，外半径 $b$ の同心の導体の球殻がある。いまその中心に電荷 $+Q$ の点電荷を置いたとき，導体表面に現れる電荷密度と電位の分布を求めよ。", "formula": "$$q_{\\text{inner}} = -Q, \\quad q_{\\text{outer}} = +Q, \\quad E(r) = \\frac{Q}{4\\pi\\varepsilon_0 r^2} \\quad (a < r < b)$$", "point": "中心に点電荷を置いた導体球殻の内表面・外表面に静電誘導される電荷量を求めます。", "check": "導体内部 ($a < r < b$) で電場ゼロとなるために内表面に $-Q$ が誘起される。", "hint": "💡 解法のヒント: 静電誘導により内表面に $-Q$, 外表面に $+Q$。導体内部（$a<r<b$）の電場は 0。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: 静電誘導により内表面に $-Q$, 外表面に $+Q$。導体内部（$a<r<b$）の電場は 0。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n内表面電荷密度: $\\sigma_a = -\\frac{Q}{4\\pi a^2}$, 外表面電荷密度: $\\sigma_b = \\frac{Q}{4\\pi b^2}$\n電位分布: $r\\ge b: \\phi = \\frac{Q}{4\\pi\\varepsilon_0 r}$, $a\\le r\\le b: \\phi = \\frac{Q}{4\\pi\\varepsilon_0 b}$, $r<a: \\phi = \\frac{Q}{4\\pi\\varepsilon_0}\\left(\\frac{1}{r}-\\frac{1}{a}+\\frac{1}{b}\\right)$", "ans": "🔑 解答・結果:\n内表面電荷密度: $\\sigma_a = -\\frac{Q}{4\\pi a^2}$, 外表面電荷密度: $\\sigma_b = \\frac{Q}{4\\pi b^2}$\n電位分布: $r\\ge b: \\phi = \\frac{Q}{4\\pi\\varepsilon_0 r}$, $a\\le r\\le b: \\phi = \\frac{Q}{4\\pi\\varepsilon_0 b}$, $r<a: \\phi = \\frac{Q}{4\\pi\\varepsilon_0}\\left(\\frac{1}{r}-\\frac{1}{a}+\\frac{1}{b}\\right)$"}, {"num": "問 8-4", "text": "広い平らな導体の表面から距離 $a$ の位置に点電荷 $q$ が置かれている。\n1) このとき生じる電場，および導体表面に誘起される電荷密度を求めよ。\n2) 点電荷を導体表面からの距離 $a$ の位置から無限遠まで引き離すために要する仕事を求めよ。", "formula": "$$q' = -q \\quad (\\text{位置 } x = -a), \\quad F = \\frac{1}{4\\pi\\varepsilon_0} \\frac{q^2}{(2a)^2} = \\frac{q^2}{16\\pi\\varepsilon_0 a^2}$$", "point": "接地導体平面近傍の点電荷に対する鏡像法（イメージ電荷 $-q$ を反対側に置く）を適用して引力を求めます。", "check": "距離が $a$ ではなく $2a$（イメージ電荷との距離）になる点に注意。", "hint": "💡 解法のヒント: 鏡像法：位置 $-a$ に鏡像電荷 $-q$ を置く。仕事 $W = \\int_a^\\infty \\frac{q^2}{4\\pi\\varepsilon_0 (2x)^2} dx$。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: 鏡像法：位置 $-a$ に鏡像電荷 $-q$ を置く。仕事 $W = \\int_a^\\infty \\frac{q^2}{4\\pi\\varepsilon_0 (2x)^2} dx$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n1) 誘起電荷密度: $\\sigma(x,y) = -\\frac{q a}{2\\pi (x^2+y^2+a^2)^{3/2}}$\n2) 仕事: $W = \\frac{q^2}{16\\pi\\varepsilon_0 a}$", "ans": "🔑 解答・結果:\n1) 誘起電荷密度: $\\sigma(x,y) = -\\frac{q a}{2\\pi (x^2+y^2+a^2)^{3/2}}$\n2) 仕事: $W = \\frac{q^2}{16\\pi\\varepsilon_0 a}$"}, {"num": "問 8-5", "text": "面積 $S$，間隔 $d$ の平行平板コンデンサーを充電し，$\\pm q$ の電荷を与えた。ただし，コンデンサーの板の縁まで電場が一様とする。\n1) 電気容量 $C$ を求めよ。\n2) コンデンサーに蓄えられるエネルギー $U$ を求めよ。\n3) 電池をはずして極板の電荷を一定に保ったまま，極板の間隔をわずか $\\Delta d$ だけ変えると，コンデンサーに蓄えられているエネルギーはどれだけ変化するか。\n4) 3)で求めたエネルギー変化から，両極板の引き合う力の大きさ $F$ を求めよ。", "formula": "$$C = \\varepsilon_0 \\frac{S}{d}, \\quad U = \\frac{Q^2}{2C} = \\frac{Q^2 d}{2\\varepsilon_0 S}, \\quad F = -\\frac{\\partial U}{\\partial d} = \\frac{Q^2}{2\\varepsilon_0 S}$$", "point": "平行板コンデンサーの静電エネルギー $U$ を極板間隔 $d$ で偏微分（仮想仕事の原理）して引力を求めます。", "check": "電荷 $Q$ 一定での微分 $F = -\\left(\\frac{\\partial U}{\\partial d}\\right)_Q$ の符号と向きを確認。", "hint": "💡 解法のヒント: 仮想仕事の原理 $F = \\frac{\\Delta U}{\\Delta d}$。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: 仮想仕事の原理 $F = \\frac{\\Delta U}{\\Delta d}$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n1) $C = \\varepsilon_0 \\frac{S}{d}$\n2) $U = \\frac{q^2 d}{2\\varepsilon_0 S}$\n3) $\\Delta U = \\frac{q^2 \\Delta d}{2\\varepsilon_0 S}$\n4) $F = \\frac{q^2}{2\\varepsilon_0 S}$", "ans": "🔑 解答・結果:\n1) $C = \\varepsilon_0 \\frac{S}{d}$\n2) $U = \\frac{q^2 d}{2\\varepsilon_0 S}$\n3) $\\Delta U = \\frac{q^2 \\Delta d}{2\\varepsilon_0 S}$\n4) $F = \\frac{q^2}{2\\varepsilon_0 S}$"}, {"num": "問 8-6", "text": "面積 A の 3 枚の導体板 $a, b, c$ を間隔 $d_1, d_2$ をおいて平行に並べた。導体板 $a, c$ を導線で接続し，導体板 $b$ に電荷 $Q$ を与えたとき，導体板の間に生じる電場を求めよ。", "formula": "$$C_1 = \\varepsilon_0 \\frac{A}{d_1}, \\quad C_2 = \\varepsilon_0 \\frac{A}{d_2}, \\quad C_{\\text{total}} = C_1 + C_2$$", "point": "3枚の平行導体板が形成する2つのコンデンサーの並列・直列接続の合成容量 _e = \\frac{1}{2}\\varepsilon_0 \\int_{R}^\\infty E(r)^2 4\\pi r^2 dr$ または $U_e = \\frac{1}{2} Q \\phi(R)$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n$U_e = \\frac{2\\pi \\sigma^2 R^3}{\\varepsilon_0} = \\frac{Q^2}{8\\pi\\varepsilon_0 R}$", "ans": "🔑 解答・結果:\n$U_e = \\frac{2\\pi \\sigma^2 R^3}{\\varepsilon_0} = \\frac{Q^2}{8\\pi\\varepsilon_0 R}$"}]}, {"id": "set9", "title": "第9回演習とレポート", "desc": "電流・Drudeモデルとオームの法則の微視的導出 （全 6 問）", "count": 6, "problems": [{"num": "問 9-1", "text": "雷雲中の電荷 $1.2\\,\\mathrm{C}$ が $1.0\\,\\mathrm{\\mu s}$ で放電した。雷電流はいくらになるか。", "formula": "$$I = \\frac{\\Delta Q}{\\Delta t} = \\frac{1.2\\,\\mathrm{C}}{1.0\\times 10^{-6}\\,\\mathrm{s}} = 1.2\\times 10^6\\,\\mathrm{A} = 1.2\\,\\mathrm{MA}$$", "point": "電流の定義 $I = dQ/dt$ に数値を代入し、落雷時の巨大な瞬間電流値を求めます。", "check": "マイクロ秒 ($\\mu\\text{s} = 10^{-6}\\text{s}$) の単位換算を正確に行おう。", "hint": "💡 解法のヒント: $I = \\frac{\\Delta Q}{\\Delta t}$", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: $I = \\frac{\\Delta Q}{\\Delta t}$<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n$I = \\frac{1.2\\,\\mathrm{C}}{1.0\\times 10^{-6}\\,\\mathrm{s}} = 1.2\\times 10^6\\,\\mathrm{A} = 1.2\\,\\mathrm{MA}$", "ans": "🔑 解答・結果:\n$I = \\frac{1.2\\,\\mathrm{C}}{1.0\\times 10^{-6}\\,\\mathrm{s}} = 1.2\\times 10^6\\,\\mathrm{A} = 1.2\\,\\mathrm{MA}$"}, {"num": "問 9-2", "text": "切り口の面積 $1\\,\\mathrm{mm^2}$，長さ $60\\,\\mathrm{cm}$ の針金の両端に $3\\,\\mathrm{V}$ の電圧をかけたときの $1\\,\\mathrm{A}$ の電流が流れた。$1\\,\\mathrm{cm^3}$ あたりの自由電子の数を $5.8\\times 10^{22}$ 個，電子の電荷を $-1.6\\times 10^{-19}\\,\\mathrm{C}$ として次の量を計算せよ。\n1) この針金の抵抗率 $\\rho$。\n2) 電子の平均の速さ $v_d$。", "formula": "$$R = \\rho \\frac{l}{S} = \\frac{l}{\\sigma S}$$", "point": "針金の長さ $l$, 断面積 $S$, 抵抗率 $\\rho$ から電気抵抗 $R$ を計算します。", "check": "断面積 $\\mathrm{mm}^2 \\to \\mathrm{m}^2$ ($10^{-6}\\mathrm{m}^2$) の単位換算に注意。", "hint": "💡 解法のヒント: 抵抗 $R=V/I=3\\,\\Omega$, $R=\\rho l/S$。電流密度 $j = n e v_d$。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: 抵抗 $R=V/I=3\\,\\Omega$, $R=\\rho l/S$。電流密度 $j = n e v_d$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n1) 抵抗率: $\\rho = 5.0\\times 10^{-6}\\,\\Omega\\cdot\\mathrm{m}$\n2) 平均速さ: $v_d = 1.1\\times 10^{-4}\\,\\mathrm{m/s}$", "ans": "🔑 解答・結果:\n1) 抵抗率: $\\rho = 5.0\\times 10^{-6}\\,\\Omega\\cdot\\mathrm{m}$\n2) 平均速さ: $v_d = 1.1\\times 10^{-4}\\,\\mathrm{m/s}$"}, {"num": "問 9-3", "text": "電気伝導度の異なる 2 種類の金属が平面で接している。境界面に垂直に密度 $\\vec{i}$ の定常電流が流れているとき，境界面に電荷が生じていることを示し，その面密度 $\\sigma$ を求めよ。", "formula": "$$j_{1n} = j_{2n} \\implies \\sigma_1 E_{1n} = \\sigma_2 E_{2n}, \\quad \\sigma_P = D_{2n} - D_{1n} = \\left(\\frac{\\varepsilon_2}{\\sigma_2} - \\frac{\\varepsilon_1}{\\sigma_1}\\right) j_n$$", "point": "定常電流の連続性（面法線成分 $j_n$ 一致）とオームの法則から境界に蓄積される面電荷密度を導きます。", "check": "異なる金属の境界に定常電流が流れるとき面電荷が誘起される物理現象を理解しよう。", "hint": "💡 解法のヒント: 電流の連続性 $i = \\sigma_1 E_1 = \\sigma_2 E_2$。ガウスの法則 $E_2 - E_1 = \\frac{\\sigma}{\\varepsilon_0}$。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: 電流の連続性 $i = \\sigma_1 E_1 = \\sigma_2 E_2$。ガウスの法則 $E_2 - E_1 = \\frac{\\sigma}{\\varepsilon_0}$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n面電荷密度: $\\sigma = \\varepsilon_0 i \\left(\\frac{1}{\\sigma_2} - \\frac{1}{\\sigma_1}\\right)$", "ans": "🔑 解答・結果:\n面電荷密度: $\\sigma = \\varepsilon_0 i \\left(\\frac{1}{\\sigma_2} - \\frac{1}{\\sigma_1}\\right)$"}, {"num": "問 9-4", "text": "内外半径 $a, b$ 長さ $l (l \\gg a,b)$ の十分に長い同軸円筒導体電極間の電気抵抗 $R$ を求めよ。ただし，電極間の媒質の導電率を $\\sigma$ とする。", "formula": "$$R = \\int_a^b \\frac{\\rho dr}{2\\pi r l} = \\frac{\\rho}{2\\pi l} \\ln\\left(\\frac{b}{a}\\right)$$", "point": "同軸円筒導体間の微小円筒シェル抵抗 $dR = \\frac{\\rho dr}{2\\pi r l}$ を半径方向に積分して合成抵抗を求めます。", "check": "静電容量 $C = \\frac{2\\pi\\varepsilon l}{\\ln(b/a)}$ との積 $R C = \\rho \\varepsilon = \\frac{\\varepsilon}{\\sigma}$ の関係を確認。", "hint": "💡 解法のヒント: 全電流 $I = 2\\pi r l j(r) = 2\\pi r l \\sigma E(r) \\implies E(r) = \\frac{I}{2\\pi \\sigma l r}$。電位差 $V = \\int_a^b E(r) dr$。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: 全電流 $I = 2\\pi r l j(r) = 2\\pi r l \\sigma E(r) \\implies E(r) = \\frac{I}{2\\pi \\sigma l r}$。電位差 $V = \\int_a^b E(r) dr$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n$R = \\frac{\\ln(b/a)}{2\\pi \\sigma l}$", "ans": "🔑 解答・結果:\n$R = \\frac{\\ln(b/a)}{2\\pi \\sigma l}$"}, {"num": "問 9-5", "text": "起電力 $V_0 = 3\\,\\mathrm{V}$，内部抵抗 $R_0 = 0.5\\,\\Omega$ の電池の両極が，長さ $1\\,\\mathrm{m}$，断面積 $1\\,\\mathrm{mm^2}$ の銅線に接続されているとき，この銅線に発生する単位時間当りのジュール熱 $P$ を求めよ。ただし銅線の抵抗率は $1.69\\times 10^{-8}\\,\\Omega\\cdot\\mathrm{m}$ とする。", "formula": "$$I = \\frac{V_0}{R_0 + R}, \\quad P_{\\text{ext}} = I^2 R = \\frac{V_0^2 R}{(R_0 + R)^2}$$", "point": "外部負荷抵抗 $R$ に供給される消費電力が最大となる条件（マッチング条件 $R = R_0$）を微分して求めます。", "check": "$\\frac{dP}{dR} = 0 \\implies R = R_0$ （最大電力輸送定理）を導出できるようにしよう。", "hint": "💡 解法のヒント: 銅線抵抗 $R = 1.69\\times 10^{-2}\\,\\Omega$。電流 $I = \\frac{V_0}{R_0+R}$。ジュール熱 $P = R I^2$。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: 銅線抵抗 $R = 1.69\\times 10^{-2}\\,\\Omega$。電流 $I = \\frac{V_0}{R_0+R}$。ジュール熱 $P = R I^2$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n電流 $I = 5.8\\,\\mathrm{A}$, ジュール熱 $P = 0.57\\,\\mathrm{W}$", "ans": "🔑 解答・結果:\n電流 $I = 5.8\\,\\mathrm{A}$, ジュール熱 $P = 0.57\\,\\mathrm{W}$"}, {"num": "問 9-6", "text": "金属導線内を流れる伝導電子のDrudeモデルに関する以下の問いに答えよ。\n1) 質量 $m$ の伝導電子は電場 $\\vec{E}$ によって加速度 $\\vec{a}$ を受ける。この加速度 $\\vec{a}$ を求めよ。\n2) 平均自由時間を $\\tau$ とするとき，時間 $2\\tau$ ごとに衝突して速度が 0 に戻るとしたときの平均速度 $\\vec{v}$ を求めよ。\n3) 断面積 $S$, 単位体積当りの伝導電子数 $n$ としたとき，オームの法則が成り立つことを示せ。\n4) 電気伝導率 $\\sigma$ を求めよ。\n5) 単位時間単位体積当りに発生するジュール熱 $J$ を求めよ。", "formula": "$$m \\frac{d\\vec{v}_d}{dt} = -e\\vec{E} - \\frac{m\\vec{v}_d}{\\tau} = 0 \\implies \\vec{v}_d = -\\frac{e\\tau}{m}\\vec{E}, \\quad \\vec{j} = -n e \\vec{v}_d = \\frac{n e^2 \\tau}{m}\\vec{E}$$", "point": "ドルーデのミクロ運動方程式から定常ドリフト速度 $\\vec{v}_d$ を求め、オームの法則 $\\vec{j} = \\sigma\\vec{E}$ と導電率 $\\sigma = \\frac{n e^2 \\tau}{m}$ を導出します。", "check": "抵抗の微視的原因が電子と格子イオンとの衝突・散乱（平均自由時間 $\\tau$）にあることを把握。", "hint": "💡 解法のヒント: $m\\vec{a} = -e\\vec{E}$, $\\bar{\\vec{v}} = -\\frac{e\\tau}{m}\\vec{E}$, $\\vec{j} = n(-e)\\bar{\\vec{v}} = \\frac{ne^2\\tau}{m}\\vec{E}$。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: $m\\vec{a} = -e\\vec{E}$, $\\bar{\\vec{v}} = -\\frac{e\\tau}{m}\\vec{E}$, $\\vec{j} = n(-e)\\bar{\\vec{v}} = \\frac{ne^2\\tau}{m}\\vec{E}$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n1) $\\vec{a} = -\\frac{e\\vec{E}}{m}$\n2) $\\bar{\\vec{v}} = -\\frac{e\\tau}{m}\\vec{E}$\n3) $I = en\\bar{v}S = \\frac{ne^2\\tau S}{ml} V \\implies V = RI$（成立）\n4) $\\sigma = \\frac{ne^2\\tau}{m}$\n5) $J = \\sigma E^2$", "ans": "🔑 解答・結果:\n1) $\\vec{a} = -\\frac{e\\vec{E}}{m}$\n2) $\\bar{\\vec{v}} = -\\frac{e\\tau}{m}\\vec{E}$\n3) $I = en\\bar{v}S = \\frac{ne^2\\tau S}{ml} V \\implies V = RI$（成立）\n4) $\\sigma = \\frac{ne^2\\tau}{m}$\n5) $J = \\sigma E^2$"}]}, {"id": "set10", "title": "第10回演習とレポート", "desc": "誘電体・分極・電束密度と境界条件 （全 2 問）", "count": 2, "problems": [{"num": "問 10-1", "text": "図1のように，面積 $S$ の金属板に $+Q (Q>0)$ の電荷を与えると，この金属板から合計 $Q/\\varepsilon_0$ 本の電気力線が出る。次に図2のように，面積 $S$ の金属板 A, B を間隔 $x$ だけ離して平行に並べ，A に $+Q$，B に $-Q$ の電荷を与える。\n1) この金属板によってできる電界の強さ $E$ を求めよ。\n2) A, B の外側の電界の強さ $E_A, E_B$ および AB 間内の電界の強さ $E_0$ を求めよ。\n3) AB 間の電圧 $V$ を求めよ。\n4) 金属板 A, B 間に働く電気的引力 $f$ と極板間隔 $x$ との関係を表すグラフを描け（$Q$ 一定 vs $V$ 一定）。\n5) A, B に平行に厚さ $t$ の導体板を入れたときの電荷分布・電場。\n6) A, B を導線で接続したときの移動電荷量。", "formula": "$$E_0 = \\frac{Q}{\\varepsilon_0 S}, \\quad V = \\frac{Q x}{\\varepsilon_0 S}, \\quad f = \\frac{Q^2}{2\\varepsilon_0 S}$$", "point": "帯電金属板の電場・電圧・引力および導体板挿入時の電荷再配置と移動電荷量を計算します。", "check": "片面あたりの電場 $E = \\frac{Q}{2\\varepsilon_0 S}$ の重ね合わせの原理をしっかり定着させよう。", "hint": "💡 解法のヒント: ガウスの法則と重ね合わせの原理。引力 $f = \\frac{Q^2}{2\\varepsilon_0 S}$。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: ガウスの法則と重ね合わせの原理。引力 $f = \\frac{Q^2}{2\\varepsilon_0 S}$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n1) $E = \\frac{Q}{2\\varepsilon_0 S}$\n2) $E_A = E_B = 0, E_0 = \\frac{Q}{\\varepsilon_0 S}$\n3) $V = E_0 x = \\frac{Q x}{\\varepsilon_0 S}$\n4) (イ) $Q$一定: $f$は距離 $x$ によらず一定。(ロ) $V$一定: $f = \\frac{\\varepsilon_0 S V^2}{2x^2} \\propto \\frac{1}{x^2}$ に反比例。\n5) 導体内部は $E=0$。両外側表面に $\\pm Q$ 誘起。\n6) 移動電荷量: $Q_{trans} = \\varepsilon_0 S E_0 = Q$", "ans": "🔑 解答・結果:\n1) $E = \\frac{Q}{2\\varepsilon_0 S}$\n2) $E_A = E_B = 0, E_0 = \\frac{Q}{\\varepsilon_0 S}$\n3) $V = E_0 x = \\frac{Q x}{\\varepsilon_0 S}$\n4) (イ) $Q$一定: $f$は距離 $x$ によらず一定。(ロ) $V$一定: $f = \\frac{\\varepsilon_0 S V^2}{2x^2} \\propto \\frac{1}{x^2}$ に反比例。\n5) 導体内部は $E=0$。両外側表面に $\\pm Q$ 誘起。\n6) 移動電荷量: $Q_{trans} = \\varepsilon_0 S E_0 = Q$"}, {"num": "問 10-2", "text": "起電力 $V$ の内部抵抗の無視できる電池，抵抗値がすべて $R$ の $R_1, R_2, R_3$，電気容量 $C_A, C_B$ のコンデンサー A, B およびスイッチ $S_1, S_2, S_3$ を接続した。\n1) この瞬間，$R_1$ を流れる電流はいくらか。\n2) 充分時間が経過したとき，コンデンサー A の極板間の電位差 $V_A$ はいくらか。\n3) コンデンサー A に蓄えられた静電エネルギー $U_1$ はいくらか。\n4) 充分時間が経過したとき，コンデンサー A, B に蓄えられた電気量をそれぞれ求めよ。\n5) コンデンサー A, B に蓄えられた静電エネルギーの和 $U_2$ を求めよ。\n6) $S_3$ を閉じてから時間が経過するまでに $R_3$ で発生したジュール熱を求めよ。", "formula": "$$I(0) = \\frac{2V}{3R}, \\quad V_A(\\infty) = \\frac{V}{2}, \\quad U_1 = \\frac{1}{8} C_A V^2, \\quad W = \\frac{C_A C_B V_A^2}{2(C_A+C_B)}$$", "point": "スイッチ切替直後（コンデンサー短絡）と十分時間経過後（電流遮断）の過渡状態・定常状態の過渡解析を行います。", "check": "ジュール熱 $W$ が静電エネルギーの差分 $\\Delta U$ から求まるエネルギー保存則を理解しよう。", "hint": "💡 解法のヒント: 初期状態（電荷0）ではコンデンサーは短絡と同じ。定常状態では電流遮断。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: 初期状態（電荷0）ではコンデンサーは短絡と同じ。定常状態では電流遮断。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n1) $I_1 = \\frac{2V}{3R}$\n2) $V_A = \\frac{V}{2}$\n3) $U_1 = \\frac{1}{2} C_A V_A^2 = \\frac{1}{8} C_A V^2$\n4) $Q_A = \\frac{C_A^2}{C_A+C_B} V_A, Q_B = \\frac{C_A C_B}{C_A+C_B} V_A$\n5) $U_2 = \\frac{C_A^2 V_A^2}{2(C_A+C_B)}$\n6) $W = U_1 - U_2 = \\frac{C_A C_B V_A^2}{2(C_A+C_B)}$", "ans": "🔑 解答・結果:\n1) $I_1 = \\frac{2V}{3R}$\n2) $V_A = \\frac{V}{2}$\n3) $U_1 = \\frac{1}{2} C_A V_A^2 = \\frac{1}{8} C_A V^2$\n4) $Q_A = \\frac{C_A^2}{C_A+C_B} V_A, Q_B = \\frac{C_A C_B}{C_A+C_B} V_A$\n5) $U_2 = \\frac{C_A^2 V_A^2}{2(C_A+C_B)}$\n6) $W = U_1 - U_2 = \\frac{C_A C_B V_A^2}{2(C_A+C_B)}$"}]}, {"id": "set11", "title": "第11回演習とレポート", "desc": "金属板・誘電体の挿入効果とエネルギー変化 （全 3 問）", "count": 3, "problems": [{"num": "問 11-1", "text": "平行板コンデンサー（極板面積 $S$，極板間隔 $d$）の両極板に $\\pm Q$ の電荷を与える。次に帯電していない厚さ $t (t<d)$ の金属板を，コンデンサー間に挿入することを考える。\n1) スイッチを開いたまま上のことを行った。このとき金属板を入れると，静電エネルギーは減少する。その減少量を求めよ。\n2) スイッチを閉じたまま行うと，今度は静電エネルギーが増加する。その増加量を求めよ。ただし電池の電位差は $V$ とする。\n3) 1) と 2) の違いはどのようなことが原因か述べよ。", "formula": "$$\\Delta U_Q = \\frac{Q^2 t}{2\\varepsilon_0 S} \\quad (\\text{減少}), \\quad \\Delta U_V = \\frac{\\varepsilon_0 S V^2 t}{2d(d-t)} \\quad (\\text{増加})$$", "point": "平行板コンデンサーへの金属板挿入におけるスイッチ開放（$Q$ 一定）とスイッチ接続（$V$ 一定）での静電エネルギー変化の物理的原因の違いを解説します。", "check": "$Q$ 一定では引力による仕事によりエネルギー減少、$V$ 一定では電池からの充電仕事によりエネルギー増加。", "hint": "💡 解法のヒント: $C_0 = \\varepsilon_0 \\frac{S}{d}$, $C = \\varepsilon_0 \\frac{S}{d-t}$。1) $U = Q^2/2C$, 2) $U = \\frac{1}{2}CV^2$。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: $C_0 = \\varepsilon_0 \\frac{S}{d}$, $C = \\varepsilon_0 \\frac{S}{d-t}$。1) $U = Q^2/2C$, 2) $U = \\frac{1}{2}CV^2$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n1) 減少量: $\\Delta U = \\frac{Q^2 t}{2\\varepsilon_0 S}$\n2) 増加量: $\\Delta U = \\frac{\\varepsilon_0 S V^2 t}{2d(d-t)}$\n3) 1) は静電引力により金属板を引き込む仕事にエネルギーが使われたため。2) は静電容量増加に伴い電池からさらに充電され，電池が仕事をしたため。", "ans": "🔑 解答・結果:\n1) 減少量: $\\Delta U = \\frac{Q^2 t}{2\\varepsilon_0 S}$\n2) 増加量: $\\Delta U = \\frac{\\varepsilon_0 S V^2 t}{2d(d-t)}$\n3) 1) は静電引力により金属板を引き込む仕事にエネルギーが使われたため。2) は静電容量増加に伴い電池からさらに充電され，電池が仕事をしたため。"}, {"num": "問 11-2", "text": "無限に広い平行板コンデンサーによって，電場 $E_0$ が真空中につくられている。この空間内に，誘電率 $\\varepsilon$ の誘電体平板を入れることを考える。\n1) 真空部分の電場の大きさはいくらか。\n2) 誘電体内の電場の大きさ $E$ はいくらか。\n3) コンデンサーに蓄えられている電荷の電荷面密度 $\\sigma$ を $\\varepsilon_0, E_0$ を用いて表せ。また $\\varepsilon, E$ を用いて表せ。", "formula": "$$D = \\varepsilon_0 E_0 = \\varepsilon E \\implies E = \\frac{\\varepsilon_0}{\\varepsilon} E_0 = \\frac{E_0}{\\varepsilon_r}, \\quad \\sigma = D = \\varepsilon_0 E_0$$", "point": "一様電場中に置かれた誘電体平板内の電場緩和 $E = E_0/\\varepsilon_r$ と真電荷面密度 $\\sigma = D$ を求めます。", "check": "電束密度 $D$ が境界を跨いで連続保存される性質（$D = \\varepsilon_0 E_0$）を活用しよう。", "hint": "💡 解法のヒント: 電束密度 $D$ の連続性：$D = \\varepsilon_0 E_0 = \\varepsilon E$。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: 電束密度 $D$ の連続性：$D = \\varepsilon_0 E_0 = \\varepsilon E$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n1) 真空部電場: $E_0$\n2) 誘電体内電場: $E = \\frac{\\varepsilon_0}{\\varepsilon} E_0$\n3) 面密度: $\\sigma = \\varepsilon_0 E_0 = \\varepsilon E$", "ans": "🔑 解答・結果:\n1) 真空部電場: $E_0$\n2) 誘電体内電場: $E = \\frac{\\varepsilon_0}{\\varepsilon} E_0$\n3) 面密度: $\\sigma = \\varepsilon_0 E_0 = \\varepsilon E$"}, {"num": "問 11-3", "text": "極板間隔 $d$ の平行板コンデンサー間を誘電体で満たす。この誘電体の誘電率 $\\varepsilon$ は距離 $x$ の関数として $\\varepsilon(x) = \\varepsilon_1 + \\frac{\\varepsilon_2-\\varepsilon_1}{d} x$ と表せる。\n1) 上，下極板をそれぞれ $+\\sigma, -\\sigma$ の電荷面密度で帯電させたとき，$x$ の位置における電界 $E(x)$ を求めよ。\n2) 上の極板に対する下の極板の電位 $V$ を $\\sigma, d, \\varepsilon_1, \\varepsilon_2$ を用いて表せ。\n3) このコンデンサーの静電容量 $C$ を $d, \\varepsilon_1, \\varepsilon_2, S$ を用いて表せ。", "formula": "$$\\varepsilon(x) = \\varepsilon_1 + \\frac{\\varepsilon_2-\\varepsilon_1}{d} x, \\quad E(x) = \\frac{\\sigma}{\\varepsilon(x)}, \\quad V = \\int_0^d E(x) dx = \\frac{\\sigma d}{\\varepsilon_2-\\varepsilon_1} \\ln\\left(\\frac{\\varepsilon_2}{\\varepsilon_1}\\right)$$", "point": "誘電率が連続変化する非一質誘電体コンデンサーの電位差を対数積分で求め、合成容量 $C = \\frac{Q}{V}$ を導出します。", "check": "$\\int_0^d \\frac{dx}{a x + b} = \\frac{1}{a} \\ln\\left(\\frac{a d + b}{b}\\right)$ の対数積分の公式を正しく展開しよう。", "hint": "💡 解法のヒント: 電束密度 $D=\\sigma$ 一定。$E(x) = \\frac{\\sigma}{\\varepsilon(x)}$。$V = \\int_0^d E(x) dx$。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: 電束密度 $D=\\sigma$ 一定。$E(x) = \\frac{\\sigma}{\\varepsilon(x)}$。$V = \\int_0^d E(x) dx$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n1) $E(x) = \\frac{\\sigma d}{(\\varepsilon_2-\\varepsilon_1)x + \\varepsilon_1 d}$\n2) $V = \\frac{\\sigma d}{\\varepsilon_2-\\varepsilon_1} \\ln\\left(\\frac{\\varepsilon_2}{\\varepsilon_1}\\right)$\n3) $C = \\frac{(\\varepsilon_2-\\varepsilon_1) S}{d \\ln(\\varepsilon_2/\\varepsilon_1)}$", "ans": "🔑 解答・結果:\n1) $E(x) = \\frac{\\sigma d}{(\\varepsilon_2-\\varepsilon_1)x + \\varepsilon_1 d}$\n2) $V = \\frac{\\sigma d}{\\varepsilon_2-\\varepsilon_1} \\ln\\left(\\frac{\\varepsilon_2}{\\varepsilon_1}\\right)$\n3) $C = \\frac{(\\varepsilon_2-\\varepsilon_1) S}{d \\ln(\\varepsilon_2/\\varepsilon_1)}$"}]}, {"id": "set12", "title": "第12回演習とレポート", "desc": "電束密度 D・分極 P・界面境界条件と屈折法則 （全 4 問）", "count": 4, "problems": [{"num": "問 12-1", "text": "誘電率 $\\varepsilon$ の誘電体を平板コンデンサーの極板間に入れる。極板の面積を $S$，間隔を $d$ としたとき，コンデンサーの極板を起電力 $V$ の電池に接続すると，誘電体の分極はいくらか。また，極板にたまる電気量はいくらか。", "formula": "$$P = D - \\varepsilon_0 E = (\\varepsilon - \\varepsilon_0) \\frac{V}{d}, \\quad Q = D S = \\varepsilon S \\frac{V}{d}$$", "point": "誘電体を満たしたコンデンサーの分極ベクトル $P$ と蓄積電荷量 $Q$ を電場 $E = V/d$ から計算します。", "check": "分極 $P = \\varepsilon_0 (\\varepsilon_r - 1) E$ の比誘電率表示も覚えておこう。", "hint": "💡 解法のヒント: 電界 $E = V/d$, 電束密度 $D = \\varepsilon E$, 分極 $P = D - \\varepsilon_0 E = (\\varepsilon-\\varepsilon_0)\\frac{V}{d}$。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: 電界 $E = V/d$, 電束密度 $D = \\varepsilon E$, 分極 $P = D - \\varepsilon_0 E = (\\varepsilon-\\varepsilon_0)\\frac{V}{d}$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n分極: $P = (\\varepsilon-\\varepsilon_0)\\frac{V}{d}$\n電気量: $Q = \\varepsilon S \\frac{V}{d}$", "ans": "🔑 解答・結果:\n分極: $P = (\\varepsilon-\\varepsilon_0)\\frac{V}{d}$\n電気量: $Q = \\varepsilon S \\frac{V}{d}$"}, {"num": "問 12-2", "text": "比誘電率 $\\varepsilon_r$ (比分極率 $\\chi_e$) の誘電体の無限に広い板を，一様な真空電場 $E_0$ の中に板面をそれに垂直にして置くとき，板面にあらわれる分極電荷面密度，誘電分極，板面の電場をそれぞれ求めよ。", "formula": "$$E = \\frac{E_0}{\\varepsilon_r}, \\quad P = \\varepsilon_0 (\\varepsilon_r - 1) E = \\frac{\\varepsilon_r - 1}{\\varepsilon_r} \\varepsilon_0 E_0, \\quad \\sigma_P = P$$", "point": "一様真空電場に置かれた誘電体板表面に現れる分極電荷面密度 $\\sigma_P$ を導出します。", "check": "分極電荷が外部電場を打ち消す向きに逆電場（減電場）を作っている物理を理解しよう。", "hint": "💡 解法のヒント: 境界条件 $D = \\varepsilon_0 E_0 = \\varepsilon E$。$P = \\chi_e E = \\frac{\\varepsilon_0 \\chi_e}{\\varepsilon_0+\\chi_e} E_0$。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: 境界条件 $D = \\varepsilon_0 E_0 = \\varepsilon E$。$P = \\chi_e E = \\frac{\\varepsilon_0 \\chi_e}{\\varepsilon_0+\\chi_e} E_0$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n板内電場: $E = \\frac{\\varepsilon_0}{\\varepsilon} E_0 = \\frac{E_0}{\\varepsilon_r}$\n誘電分極: $P = \\varepsilon_0 (\\varepsilon_r - 1) E = \\frac{\\varepsilon_r - 1}{\\varepsilon_r} \\varepsilon_0 E_0$\n分極電荷面密度: $\\alpha' = P = \\frac{\\varepsilon_r - 1}{\\varepsilon_r} \\varepsilon_0 E_0$", "ans": "🔑 解答・結果:\n板内電場: $E = \\frac{\\varepsilon_0}{\\varepsilon} E_0 = \\frac{E_0}{\\varepsilon_r}$\n誘電分極: $P = \\varepsilon_0 (\\varepsilon_r - 1) E = \\frac{\\varepsilon_r - 1}{\\varepsilon_r} \\varepsilon_0 E_0$\n分極電荷面密度: $\\alpha' = P = \\frac{\\varepsilon_r - 1}{\\varepsilon_r} \\varepsilon_0 E_0$"}, {"num": "問 12-3", "text": "厚さがそれぞれ $d_1$ および $d_2$，誘電率がそれぞれ $\\varepsilon_1$ および $\\varepsilon_2$ の 2 種類の誘電体の平板がある。この平板を重ねて，両面に電極をつけてコンデンサーを作り，起電力 $V$ の電池につなぐ。このとき，以下を求めよ。\n1) 誘電体内の電束密度 $D$\n2) 電極面の電荷面密度 $\\sigma$\n3) 誘電体 1, 誘電体 2 のそれぞれの分極 $P_1, P_2$", "formula": "$$D = \\frac{V}{\\frac{d_1}{\\varepsilon_1} + \\frac{d_2}{\\varepsilon_2}} = \\frac{\\varepsilon_1 \\varepsilon_2 V}{\\varepsilon_1 d_2 + \\varepsilon_2 d_1}, \\quad P_1 = (\\varepsilon_1 - \\varepsilon_0)\\frac{D}{\\varepsilon_1}$$", "point": "2層直列誘電体コンデンサーの各層における電束密度 $D$ の連続性と分極 $P_1, P_2$ を計算します。", "check": "直列接続において電束密度 $D$ が両層で共通（$D_1 = D_2 = D$）になる点が最大のポイント。", "hint": "💡 解法のヒント: 電束密度の連続性 $D = \\varepsilon_1 E_1 = \\varepsilon_2 E_2$。全電圧 $V = E_1 d_1 + E_2 d_2$。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: 電束密度の連続性 $D = \\varepsilon_1 E_1 = \\varepsilon_2 E_2$。全電圧 $V = E_1 d_1 + E_2 d_2$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n1) $D = \\frac{\\varepsilon_1 \\varepsilon_2 V}{\\varepsilon_1 d_2 + \\varepsilon_2 d_1}$\n2) $\\sigma = D = \\frac{\\varepsilon_1 \\varepsilon_2 V}{\\varepsilon_1 d_2 + \\varepsilon_2 d_1}$\n3) $P_1 = \\frac{\\varepsilon_2 (\\varepsilon_1-\\varepsilon_0) V}{\\varepsilon_1 d_2 + \\varepsilon_2 d_1}$, $P_2 = \\frac{\\varepsilon_1 (\\varepsilon_2-\\varepsilon_0) V}{\\varepsilon_1 d_2 + \\varepsilon_2 d_1}$", "ans": "🔑 解答・結果:\n1) $D = \\frac{\\varepsilon_1 \\varepsilon_2 V}{\\varepsilon_1 d_2 + \\varepsilon_2 d_1}$\n2) $\\sigma = D = \\frac{\\varepsilon_1 \\varepsilon_2 V}{\\varepsilon_1 d_2 + \\varepsilon_2 d_1}$\n3) $P_1 = \\frac{\\varepsilon_2 (\\varepsilon_1-\\varepsilon_0) V}{\\varepsilon_1 d_2 + \\varepsilon_2 d_1}$, $P_2 = \\frac{\\varepsilon_1 (\\varepsilon_2-\\varepsilon_0) V}{\\varepsilon_1 d_2 + \\varepsilon_2 d_1}$"}, {"num": "問 12-4", "text": "誘電率 $\\varepsilon_1, \\varepsilon_2$ の 2 つの誘電体が電荷のない界面で接しており，点 P において誘電体(1)側の電界が $E_1$ で，その法線方向のなす角度が $\\theta_1$ であるとする。ここで $\\varepsilon_1 < \\varepsilon_2$ のとき，$\\theta_1$ と $\\theta_2$，$E_1$ と $E_2$，$D_1$ と $D_2$ のそれぞれの大小関係を表せ。また点 P における誘電体(2)側の電場 $E_2$ を $E_1, \\theta_1, \\varepsilon_1, \\varepsilon_2$ を用いて表せ。", "formula": "$$E_{1t} = E_{2t} \\implies E_1 \\sin\\theta_1 = E_2 \\sin\\theta_2, \\quad D_{1n} = D_{2n} \\implies \\varepsilon_1 E_1 \\cos\\theta_1 = \\varepsilon_2 E_2 \\cos\\theta_2, \\quad \\frac{\\tan\\theta_1}{\\tan\\theta_2} = \\frac{\\varepsilon_1}{\\varepsilon_2}$$", "point": "誘電体界面における電界・電束密度の境界条件から電気力線・電束線の屈折法則を証明します。", "check": "$\\varepsilon_1 < \\varepsilon_2$ のとき屈折角 $\\theta_1 < \\theta_2$、電場強度は $E_1 > E_2$ となる大小関係を確認しよう。", "hint": "💡 解法のヒント: 接線成分連続 $E_{1t} = E_{2t} \\implies E_1\\sin\\theta_1 = E_2\\sin\\theta_2$。法線成分連続 $D_{1n} = D_{2n} \\implies \\varepsilon_1 E_1\\cos\\theta_1 = \\varepsilon_2 E_2\\cos\\theta_2$。", "steps": "<b>【解法の指針・基本アプローチ】</b><br>💡 解法のヒント: 接線成分連続 $E_{1t} = E_{2t} \\implies E_1\\sin\\theta_1 = E_2\\sin\\theta_2$。法線成分連続 $D_{1n} = D_{2n} \\implies \\varepsilon_1 E_1\\cos\\theta_1 = \\varepsilon_2 E_2\\cos\\theta_2$。<br><br><b>【詳細な計算・導出ステップ】</b><br>🔑 解答・結果:\n大小関係: $\\theta_1  E_2, \\quad D_1 < D_2$\n電場: $E_2 = E_1 \\sqrt{\\sin^2\\theta_1 + \\left(\\frac{\\varepsilon_1}{\\varepsilon_2}\\right)^2 \\cos^2\\theta_1}$", "ans": "🔑 解答・結果:\n大小関係: $\\theta_1  E_2, \\quad D_1 < D_2$\n電場: $E_2 = E_1 \\sqrt{\\sin^2\\theta_1 + \\left(\\frac{\\varepsilon_1}{\\varepsilon_2}\\right)^2 \\cos^2\\theta_1}$"}]}];
        
        let allProblemsList = [];
        let totalGlobalIndex = 1;

        setsData.forEach(s => {
            s.problems.forEach(p => {
                allProblemsList.push({
                    ...p,
                    setNum: s.title,
                    setId: s.id,
                    globalIndex: totalGlobalIndex++
                });
            });
        });

        let currentCardIndex = 0;
        let viewMode = 'single';
        let completedProbs = JSON.parse(localStorage.getItem('em_completed') || '{}');
        let favProbs = JSON.parse(localStorage.getItem('em_favs') || '{}');

        function init() {
            populateDropdown();
            renderSingleCard();
            updateProgress();
            
            document.addEventListener('keydown', (e) => {
                if (viewMode === 'single') {
                    if (e.key === 'ArrowLeft') navigateCard(-1);
                    if (e.key === 'ArrowRight') navigateCard(1);
                }
            });
        }

        function populateDropdown() {
            const dropdown = document.getElementById('card-dropdown');
            dropdown.innerHTML = '';
            allProblemsList.forEach((p, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = `${p.num} (${p.setNum.split('演習')[0]})`;
                dropdown.appendChild(opt);
            });
        }

        function switchViewMode(mode) {
            viewMode = mode;
            document.getElementById('btn-mode-single').classList.toggle('active', mode === 'single');
            document.getElementById('btn-mode-list').classList.toggle('active', mode === 'list');
            document.getElementById('single-view-container').style.display = mode === 'single' ? 'block' : 'none';
            document.getElementById('list-view-container').style.display = mode === 'list' ? 'block' : 'none';

            if (mode === 'single') {
                renderSingleCard();
            } else {
                renderAllCards();
            }
        }

        function buildCardHtml(p, idx) {
            const isDone = !!completedProbs[p.num];
            const isFav = !!favProbs[p.num];
            const formattedNo = String(p.globalIndex).padStart(3, '0');

            return `
                <article class="problem-card ${isDone ? 'is-completed' : ''}" id="card-${p.num.replace(/[^a-zA-Z0-9-]/g, '')}">
                    <div class="card-top-bar"></div>
                    <div class="card-inner">

                        <!-- ① カードヘッダー -->

                            <div class="no-badge">No. ${formattedNo}</div>
                            <div class="header-titles">
                                <span class="chapter-title">${p.setNum}</span>
                                <h2 class="main-title">${p.num} の演習課題解説</h2>
                            </div>

                            </div>
                            <div class="block-content">${p.text}</div>
                        </section>

                        <!-- ③ 【公式・解法の要点】 -->

                            <div class="block-header">
                                <span class="block-tag tag-green">【公式・解法の要点】</span>
                            </div>
                            <div class="block-content">
                                <div class="point-formula-box">
                                    <strong>【使用する数学・物理公式】</strong><br>
                                    ${p.formula}
                                </div>

                            </div>

                            </div>

                        <section class="card-block block-check">

                        </section>

        function renderSingleCard() {
            const p = allProblemsList[currentCardIndex];
            const mount = document.getElementById('single-card-mount');

            document.getElementById('card-dropdown').value = currentCardIndex;
            document.getElementById('card-counter-label').innerText = `${currentCardIndex + 1} / ${allProblemsList.length} 問`;
            document.getElementById('btn-prev-card').disabled = (currentCardIndex === 0);
            document.getElementById('btn-next-card').disabled = (currentCardIndex === allProblemsList.length - 1);

            mount.innerHTML = buildCardHtml(p, currentCardIndex);

            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function renderAllCards() {
            const mount = document.getElementById('all-cards-mount');
            mount.innerHTML = allProblemsList.map((p, idx) => buildCardHtml(p, idx)).join('');

            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function navigateCard(dir) {
            let nextIdx = currentCardIndex + dir;
            if (nextIdx >= 0 && nextIdx < allProblemsList.length) {
                currentCardIndex = nextIdx;
                renderSingleCard();
                window.scrollTo({ top: 120, behavior: 'smooth' });
            }
        }

        function jumpToCard(idxStr) {
            currentCardIndex = parseInt(idxStr, 10);
            renderSingleCard();
        }

        function toggleCompleted(num) {
            if (completedProbs[num]) {
                delete completedProbs[num];
            } else {
                completedProbs[num] = true;
            }
            localStorage.setItem('em_completed', JSON.stringify(completedProbs));
            updateProgress();
            if (viewMode === 'single') renderSingleCard();
            else renderAllCards();
        }

        function toggleFav(num) {
            if (favProbs[num]) {
                delete favProbs[num];
            } else {
                favProbs[num] = true;
            }
            localStorage.setItem('em_favs', JSON.stringify(favProbs));
            if (viewMode === 'single') renderSingleCard();
            else renderAllCards();
        }

        function updateProgress() {
            let total = allProblemsList.length;
            let count = Object.keys(completedProbs).length;
            let pct = Math.round((count / total) * 100);
            document.getElementById('progress-badge').innerText = `進捗: ${count} / ${total} 問完了 (${pct}%)`;
        }

        window.onload = init;
    </script>
</body>
</html>
