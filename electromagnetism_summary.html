            const prevBtnTitle = document.getElementById('prev-btn-title');
            const nextBtnTitle = document.getElementById('next-btn-title');
            const copyBtn = document.getElementById('copy-btn');
            const toast = document.getElementById('toast-notification');
            const toastMessage = document.getElementById('toast-message');
            const searchBannerContainer = document.getElementById('search-banner-container');

            // Initialize Mermaid
            mermaid.initialize({
                startOnLoad: false,
                theme: 'dark',
                securityLevel: 'loose'
            });

            // Set up marked with custom renderer for Mermaid
            const renderer = new marked.Renderer();
            renderer.code = function(code, infostring) {
                let text = code;
                let lang = infostring;
                if (code && typeof code === 'object') {
                    text = code.text;
                    lang = code.lang;
                }
                if (lang === 'mermaid') {
                    return `<div class="mermaid">${text}</div>`;
                }
                return `<pre><code class="language-${lang || ''}">${text}</code></pre>`;
            };
            marked.use({ renderer });

            // 2. Data Parsing
            const rawMarkdown = document.getElementById('markdown-data').textContent;
            
            function parseMarkdownToSections(rawMarkdown) {
                const sections = [];
                const parts = rawMarkdown.split('## 各回の詳細解説');
                const overviewText = parts[0];
                const lecturesText = parts[1] || '';
                
                sections.push({
                    id: 'overview',
                    title: '概要と全体像',
                    content: overviewText
                });
                
                const lectureParts = lecturesText.split(/(?=### 第)/);
                lectureParts.forEach((part, index) => {
                    if (!part.trim()) return;
                    
                    const titleMatch = part.match(/### (第\d+回：[^\n]+)/);
                    if (titleMatch) {
                        const title = titleMatch[1];
                        const cleanContent = part.replace(/### 第\d+回：[^\n]+\n/, '');
                        sections.push({
                            id: `lecture-${index + 1}`,
                            title: title,
                            content: cleanContent
                        });
                    }
                });
                
                return sections;
            }

            const sections = parseMarkdownToSections(rawMarkdown);
            let activeSectionIndex = 0;
            let currentSearchQuery = "";

            // 3. Formula Extractor for Quick View
            function extractFormulas(sectionsList) {
                const formulas = [];
                let idCounter = 0;
                sectionsList.forEach(section => {
                    if (section.id === 'overview' || section.id === 'formulas-cheat-sheet') return;
                    
                    const matches = [...section.content.matchAll(/\$\$([\s\S]*?)\$\$/g)];
                    matches.forEach(match => {
                        const formulaText = match[1].trim();
                        const contentBefore = section.content.substring(0, match.index);
                        const linesBefore = contentBefore.trim().split('\n');
                        let desc = '';
                        
                        for (let i = linesBefore.length - 1; i >= 0; i--) {
                            const line = linesBefore[i].trim();
                            if (line.startsWith('*') || line.startsWith('-') || line.startsWith('1.') || line.startsWith('#####') || (line && line.length > 3 && !line.includes('$$') && !line.startsWith('###') && !line.startsWith('---'))) {
                                desc = line.replace(/^[\*\-\s\d\.\#]+/, '');
                                break;
                            }
                        }
                        if (!desc) desc = '基本公式';
                        
                        formulas.push({
                            id: `formula-${idCounter++}`,
                            sectionTitle: section.title.split('：')[0],
                            desc: desc,
                            formula: formulaText
                        });
                    });
                });
                return formulas;
            }

            const formulasList = extractFormulas(sections);
            
            // Add a special formulas tab
            sections.push({
                id: 'formulas-cheat-sheet',
                title: '公式まとめシート',
                isSpecial: true,
                content: '' // Rendered via JS dynamically
            });

            // 4. Math Markdown Renderer
            function renderMarkdownWithMath(markdown, container) {
                const mathBlocks = [];
                const inlineMath = [];
                
                // Replace block math $$ ... $$
                let processed = markdown.replace(/\$\$([\s\S]*?)\$\$/g, (match, p1) => {
                    const id = `MATHBLOCK_${mathBlocks.length}_MATH`;
                    mathBlocks.push({ id, formula: p1 });
                    return id;
                });
                
                // Replace inline math $ ... $
                processed = processed.replace(/\$([^\$\n]+?)\$/g, (match, p1) => {
                    const id = `MATHINLINE_${inlineMath.length}_MATH`;
                    inlineMath.push({ id, formula: p1 });
                    return id;
                });
                
                // Run marked parser
                let html = marked.parse(processed);
                
                // Restore block math with KaTeX
                mathBlocks.forEach(item => {
                    try {
                        const rendered = katex.renderToString(item.formula, { displayMode: true, throwOnError: false });
                        html = html.split(item.id).join(`<div class="math-block" title="クリックしてLaTeXをコピー" data-formula="${encodeURIComponent(item.formula)}">${rendered}</div>`);
                    } catch (e) {
                        html = html.split(item.id).join(`<div class="math-block error">${item.formula}</div>`);
                    }
                });
                
                // Restore inline math with KaTeX
                inlineMath.forEach(item => {
                    try {
                        const rendered = katex.renderToString(item.formula, { displayMode: false, throwOnError: false });
                        html = html.split(item.id).join(`<span class="math-inline" title="クリックしてLaTeXをコピー" data-formula="${encodeURIComponent(item.formula)}">${rendered}</span>`);
                    } catch (e) {
                        html = html.split(item.id).join(`<span class="math-inline error">${item.formula}</span>`);
                    }
                });
                
                container.innerHTML = html;
            }

            // 5. Highlight Search Text
            function highlightText(element, query) {
                if (!query) return;
                
                const regex = new RegExp(`(${query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')})`, 'gi');
                
                const walk = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
                const nodesToReplace = [];
                
                let node;
                while (node = walk.nextNode()) {
                    // Check if node is not inside code or math blocks or formulas
                    let parent = node.parentNode;
                    let isProtected = false;
                    while (parent && parent !== element) {
                        if (parent.parentNode && (parent.tagName === 'CODE' || parent.tagName === 'PRE' || parent.classList.contains('katex') || parent.classList.contains('mermaid') || parent.classList.contains('math-block') || parent.classList.contains('math-inline'))) {
                            isProtected = true;
                            break;
                        }
                        parent = parent.parentNode;
                    }
                    
                    if (!isProtected && regex.test(node.nodeValue)) {
                        nodesToReplace.push(node);
                    }
                }
                
                nodesToReplace.forEach(textNode => {
                    const span = document.createElement('span');
                    span.innerHTML = textNode.nodeValue.replace(regex, '<mark class="search-highlight">$1</mark>');
                    textNode.parentNode.replaceChild(span, textNode);
                });
            }

            // 6. Display Active Section
            function displaySection(index) {
                activeSectionIndex = index;
                const section = sections[index];
                
                // Update active menu highlight
                document.querySelectorAll('.menu-item').forEach((item, idx) => {
                    if (idx === index) {
                        item.classList.add('active');
                        item.setAttribute('aria-selected', 'true');
                    } else {
                        item.classList.remove('active');
                        item.setAttribute('aria-selected', 'false');
                    }
                });

                // Scroll to top
                document.querySelector('.content-scroll').scrollTop = 0;

                // Update Breadcrumbs
                activeBreadcrumb.textContent = section.title;

                // Render Content
                if (section.id === 'formulas-cheat-sheet') {
                    // Render the specialized formula sheet grid
                    renderedContent.innerHTML = `
                        <h1>公式まとめ・クイック参照シート</h1>
                        <p>各解説資料から抽出された主要公式の一覧です。クリックすると数式のLaTeXソースコードをコピーできます。</p>
                        <div class="formulas-grid" id="formulas-grid-container"></div>
                    `;
                    
                    const grid = document.getElementById('formulas-grid-container');
                    formulasList.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'formula-card';
                        
                        const mathRender = katex.renderToString(item.formula, { displayMode: true, throwOnError: false });
                        
                        card.innerHTML = `
                            <div class="formula-card-header">
                                <span class="formula-card-title" id="desc-${item.id}"></span>
                                <span class="formula-card-tag">${item.sectionTitle}</span>
                            </div>
                            <div class="math-block" style="margin: 0; padding: 14px;" data-formula="${encodeURIComponent(item.formula)}">
                                ${mathRender}
                            </div>
                        `;
                        grid.appendChild(card);
                        
                        // Render description with KaTeX support!
                        const descEl = card.querySelector(`#desc-${item.id}`);
                        renderMarkdownWithMath(item.desc, descEl);
                    });
                } else {
                    // Render standard section markdown
                    renderMarkdownWithMath(section.content, renderedContent);
                }

                // Render Mermaid Diagrams if any
                try {
                    mermaid.run({
                        nodes: renderedContent.querySelectorAll('.mermaid')
                    });
                } catch (e) {
                    console.error("Mermaid error:", e);
                }

                // Apply search highlight if active query
                if (currentSearchQuery) {
                    highlightText(renderedContent, currentSearchQuery);
                    showSearchBanner();
                } else {
                    searchBannerContainer.innerHTML = "";
                }

                // Update Footer Buttons
                if (index > 0) {
                    prevBtn.classList.remove('disabled');
                    prevBtnTitle.textContent = sections[index - 1].title;
                } else {
                    prevBtn.classList.add('disabled');
                    prevBtnTitle.textContent = "なし";
                }

                if (index < sections.length - 1) {
                    nextBtn.classList.remove('disabled');
                    nextBtnTitle.textContent = sections[index + 1].title;
                } else {
                    nextBtn.classList.add('disabled');
                    nextBtnTitle.textContent = "なし";
                }

                // Attach copy click listener to math formulas
                document.querySelectorAll('.math-block, .math-inline').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const formula = decodeURIComponent(el.getAttribute('data-formula') || '');
                        if (formula) {
                            navigator.clipboard.writeText(formula).then(() => {
                                showToast(`数式 (LaTeX): "${formula}" をコピーしました！`);
                            });
                        }
                    });
                });
            }

            // 7. Toast Notification Handler
            function showToast(message) {
                toastMessage.textContent = message;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            // 8. Copy entire section content
            copyBtn.addEventListener('click', () => {
                const text = renderedContent.innerText;
                navigator.clipboard.writeText(text).then(() => {
                    showToast('セクションのテキストをコピーしました！');
                });
            });

            // 9. Render Menu items in Sidebar
            function renderMenu(query = "") {
                menuContainer.innerHTML = '<div class="menu-label">コンテンツ</div>';
                
                sections.forEach((section, index) => {
                    // Search matching check
                    let isMatch = true;
                    if (query) {
                        const contentToSearch = (section.title + " " + section.content).toLowerCase();
                        isMatch = contentToSearch.includes(query.toLowerCase());
                    }

                    if (isMatch) {
                        const menuItem = document.createElement('button');
                        menuItem.className = `menu-item ${index === activeSectionIndex ? 'active' : ''}`;
                        menuItem.setAttribute('role', 'tab');
                        menuItem.setAttribute('aria-selected', index === activeSectionIndex ? 'true' : 'false');
                        menuItem.setAttribute('aria-controls', 'rendered-content');
                        menuItem.setAttribute('tabindex', '0');
                        
                        let iconClass = "fa-solid fa-file-lines";
                        if (section.id === 'overview') iconClass = "fa-solid fa-compass";
                        if (section.id === 'formulas-cheat-sheet') iconClass = "fa-solid fa-square-root-variable";

                        menuItem.innerHTML = `
                            <i class="${iconClass}" aria-hidden="true"></i>
                            <span style="flex-grow:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${section.title}">
                                ${section.title}
                            </span>
                        `;
                        
                        // Click navigation
                        menuItem.addEventListener('click', () => {
                            displaySection(index);
                        });

                        // Keyboard navigation (Enter / Space)
                        menuItem.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                displaySection(index);
                            }
                        });
                        
                        menuContainer.appendChild(menuItem);
                    }
                });
            }

            // 10. Search logic
            searchBox.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                currentSearchQuery = query;
                
                if (query) {
                    clearSearchBtn.style.display = 'block';
                } else {
                    clearSearchBtn.style.display = 'none';
                }

                renderMenu(query);
                
                // Refresh active section highlights
                displaySection(activeSectionIndex);
            });

            clearSearchBtn.addEventListener('click', () => {
                searchBox.value = "";
                currentSearchQuery = "";
                clearSearchBtn.style.display = 'none';
                renderMenu();
                displaySection(activeSectionIndex);
            });

            function showSearchBanner() {
                searchBannerContainer.innerHTML = `
                    <div class="search-results-banner">
                        <div class="search-results-text">
                            キーワード「<strong>${currentSearchQuery}</strong>」の検索結果をハイライト表示しています
                        </div>
                        <button class="close-banner-btn" id="close-search-banner" aria-label="検索結果表示を閉じる">
                            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                        </button>
                    </div>
                `;
                document.getElementById('close-search-banner').addEventListener('click', () => {
                    searchBox.value = "";
                    currentSearchQuery = "";
                    clearSearchBtn.style.display = 'none';
                    renderMenu();
                    displaySection(activeSectionIndex);
                });
            }

            // 11. Footer Navigation clicks
            prevBtn.addEventListener('click', () => {
                if (activeSectionIndex > 0) {
                    displaySection(activeSectionIndex - 1);
                }
            });

            nextBtn.addEventListener('click', () => {
                if (activeSectionIndex < sections.length - 1) {
                    displaySection(activeSectionIndex + 1);
                }
            });

            // 12. Dark/Light Theme toggler
            let currentTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            updateThemeButton(currentTheme);

            themeToggleBtn.addEventListener('click', () => {
                const targetTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', targetTheme);
                localStorage.setItem('theme', targetTheme);
                updateThemeButton(targetTheme);
                
                // Re-render Mermaid because Mermaid themes differ by mode
                mermaid.initialize({
                    theme: targetTheme === 'dark' ? 'dark' : 'default'
                });
                displaySection(activeSectionIndex);
            });

            function updateThemeButton(theme) {
                if (theme === 'dark') {
                    themeToggleBtn.innerHTML = '<i class="fa-solid fa-sun" aria-hidden="true"></i><span class="sr-only">ライトモードへ切り替え</span>';
                    themeToggleBtn.style.color = '#eab308'; // Sunlight yellow
                } else {
                    themeToggleBtn.innerHTML = '<i class="fa-solid fa-moon" aria-hidden="true"></i><span class="sr-only">ダークモードへ切り替え</span>';
                    themeToggleBtn.style.color = '#2563eb'; // Moon indigo
                }
            }

            // 13. Initialization
            renderMenu();
            displaySection(0);
        });
    </script>
</body>
</html>
